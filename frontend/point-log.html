<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=mommy-icon2-20260607">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=mommy-icon2-20260607">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=mommy-icon2-20260607">
    <link rel="shortcut icon" href="favicon.ico?v=mommy-icon2-20260607">
    <link rel="manifest" href="site.webmanifest?v=mommy-icon2-20260607">
    <script src="idle-home-redirect.js"></script>
    <script src="offline-redirect-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rewards - The Mommy App</title>
    <link rel="stylesheet" href="fonts-local.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="paradigm.css">
    <link rel="stylesheet" href="home-redesign-v4.css">
    <link rel="stylesheet" href="subject-icons.css">
    <link rel="stylesheet" href="kid-app-navigation.css">
    <link rel="stylesheet" href="point-log.css">
</head>
<body class="manage-page point-log-page">
    <div class="container">
        <header class="page-header-with-back page-header-with-actions point-log-header">
            <div class="page-header-row">
                <h1>
                    <span class="page-title-icon" aria-hidden="true">🎁</span>
                    Rewards
                </h1>
                <div class="page-header-end">
                    <div id="kidAvatarSwitcher" class="kid-avatar-switcher hidden" role="tablist" aria-label="Kids"></div>
                    <div class="page-header-actions" data-family-user-switcher></div>
                </div>
            </div>
        </header>

        <main class="point-log-layout">
            <div id="logError" class="error hidden"></div>
            <div id="pointLogSuccess" class="point-log-success-banner hidden" role="status" aria-live="polite"></div>

            <section class="settings-card settings-section point-log-workbench is-mode-unselected">
                <div class="settings-card-body">
                    <div class="point-log-mode-row">
                        <div class="cards-view-toggle-group cards-view-toggle-group-centered" role="group" aria-label="Point log modes">
                            <button type="button" class="cards-view-toggle-btn" data-mode="bonus"><span class="cards-view-toggle-btn-icon" data-icon="thumbs-up" data-icon-size="16" data-icon-stroke="2.4"></span><span class="point-rule-tab-long">Earn</span><span class="point-rule-tab-short">Earn</span></button>
                            <button type="button" class="cards-view-toggle-btn" data-mode="deduction"><span class="cards-view-toggle-btn-icon" data-icon="thumbs-down" data-icon-size="16" data-icon-stroke="2.4"></span><span class="point-rule-tab-long">Loss</span><span class="point-rule-tab-short">Loss</span></button>
                            <button type="button" class="cards-view-toggle-btn" data-mode="rewards"><span class="cards-view-toggle-btn-icon" data-icon="gift" data-icon-size="16" data-icon-stroke="2.4"></span><span class="point-rule-tab-long">Redeem</span><span class="point-rule-tab-short">Redeem</span></button>
                        </div>
                    </div>

                    <div id="pointLogEntryContent" class="point-log-entry-content">
                    <form id="pointLogForm" class="point-log-form paradigm-editing-row">
                        <div class="point-log-entry-row">
                            <div class="form-group point-log-emoji-group">
                                <label for="pointEmoji">Emoji</label>
                                <div class="point-log-emoji-field">
                                    <input id="pointEmoji" class="paradigm-input" type="text" autocomplete="off" inputmode="text" maxlength="8" placeholder=" ">
                                    <span class="point-log-emoji-placeholder" aria-hidden="true">🙂</span>
                                </div>
                            </div>
                            <div class="form-group point-log-name-group">
                                <label for="pointRuleName">Name</label>
                                <input id="pointRuleName" class="paradigm-input" type="text" autocomplete="off" placeholder="What happened?">
                            </div>
                            <div class="form-group point-log-points-group">
                                <label for="pointPoints">Points</label>
                                <div class="point-log-stepper" role="group" aria-label="Points">
                                    <button type="button" class="point-log-stepper-btn" data-point-step="-1" aria-label="Decrease points">
                                        <span class="icon" data-icon="minus"></span>
                                    </button>
                                    <input id="pointPoints" class="point-log-stepper-input" type="number" autocomplete="off" inputmode="numeric" min="0" step="1" value="0" placeholder="0">
                                    <button type="button" class="point-log-stepper-btn" data-point-step="1" aria-label="Increase points">
                                        <span class="icon" data-icon="plus"></span>
                                    </button>
                                </div>
                            </div>
                            <div id="noteGroup" class="form-group">
                                <label for="pointNote">Note <span>(optional)</span></label>
                                <input id="pointNote" class="paradigm-input" type="text" autocomplete="off" placeholder="Add note (optional)">
                            </div>
                        </div>
                        <div id="pointLogKidPicker" class="point-log-kid-picker" role="group" aria-label="Choose kids"></div>
                        <button id="submitPointLogBtn" type="submit" class="point-log-submit-btn" aria-label="Confirm" disabled></button>
                    </form>

                    <div id="templateList" class="point-template-list"></div>

                    <div id="selectionPanel" class="point-selection-panel hidden"></div>
                    </div>
                </div>
            </section>

            <section class="settings-card settings-section point-history-section">
                <div class="settings-card-body">
                    <div id="pointHistory" class="point-history"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="icons.js"></script>
    <script src="family-user-switcher.js"></script>
    <script src="kid-app-navigation.js"></script>
    <script src="subject-icons.js"></script>
    <script src="point-history-common.js"></script>
    <script src="point-rule-template-common.js"></script>
    <script src="point-log.js"></script>
</body>
</html>
