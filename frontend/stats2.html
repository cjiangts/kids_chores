<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=mommy-icon2-20260607">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=mommy-icon2-20260607">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=mommy-icon2-20260607">
    <link rel="shortcut icon" href="favicon.ico?v=mommy-icon2-20260607">
    <link rel="manifest" href="site.webmanifest?v=mommy-icon2-20260607">
    <script src="idle-home-redirect.js"></script>
    <script src="offline-redirect-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stats - The Mommy App</title>
    <link rel="stylesheet" href="fonts-local.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="paradigm.css">
    <link rel="stylesheet" href="home-redesign-v4.css">
    <link rel="stylesheet" href="subject-icons.css">
    <link rel="stylesheet" href="kid-app-navigation.css">
    <link rel="stylesheet" href="stats2.css">
</head>
<body class="manage-page stats2-page">
    <div class="container">
        <header class="page-header-with-back page-header-with-actions stats-header">
            <div class="page-header-row">
                <h1>
                    <span class="page-title-icon icon" data-icon="bar-chart-3" data-icon-size="24" data-icon-stroke="2.6" aria-hidden="true"></span>
                    Stats
                </h1>
                <div class="page-header-end">
                    <div class="page-header-actions" data-family-user-switcher></div>
                </div>
            </div>
        </header>

        <main>
            <div id="stats2Error" class="error hidden"></div>
            <section class="settings-card settings-section paradigm-settings-panel paradigm-settings-panel--content-first">
                <div class="settings-card-body stats-workbench stats2-workbench">
                    <div class="stats-heading">
                        <div class="stats2-race-heading">
                            <span class="stats2-heading-emoji" aria-hidden="true">🏆</span>
                            <h2 id="stats2RaceTitle" class="paradigm-panel-heading">This Week's Race</h2>
                            <p id="stats2WeekMeta" class="stats2-week-range"></p>
                        </div>
                        <div class="stats2-week-controls">
                            <button type="button" id="stats2PreviousWeek" class="paradigm-icon-btn stats2-week-nav" aria-label="Previous week">
                                <span class="icon" data-icon="chevron-left" data-icon-size="16" data-icon-stroke="2.7" aria-hidden="true"></span>
                            </button>
                            <button type="button" id="stats2NextWeek" class="paradigm-icon-btn stats2-week-nav" aria-label="Next week">
                                <span class="icon" data-icon="chevron-right" data-icon-size="16" data-icon-stroke="2.7" aria-hidden="true"></span>
                            </button>
                            <span id="stats2DaysLeft" class="stats2-days-left"></span>
                        </div>
                    </div>
                    <div id="stats2BalanceRace" class="stats2-balance-race"></div>
                    <div class="stats-heading stats-heading--items">
                        <div class="stats2-board-heading">
                            <span class="stats2-heading-emoji" aria-hidden="true">🎯</span>
                            <h2 class="paradigm-panel-heading">Race Board</h2>
                        </div>
                    </div>
                    <div id="stats2RaceCards" class="stats2-race-cards"></div>
                </div>
            </section>

            <section class="settings-card settings-section paradigm-settings-panel paradigm-settings-panel--content-first">
                <div class="settings-card-body stats-workbench stats2-workbench">
                    <div class="stats-heading">
                        <div class="stats2-board-heading">
                            <span class="stats2-heading-emoji" aria-hidden="true">✨</span>
                            <h2 id="stats2HighlightsTitle" class="paradigm-panel-heading">This Week's Highlights</h2>
                        </div>
                    </div>
                    <div id="stats2HighlightTabs" class="stats2-highlight-tabs"></div>
                    <div id="stats2Highlights" class="stats2-highlights"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="icons.js"></script>
    <script src="subject-icons.js"></script>
    <script src="family-user-switcher.js"></script>
    <script src="kid-app-navigation.js"></script>
    <script src="stats2.js"></script>
</body>
</html>
