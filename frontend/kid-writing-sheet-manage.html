<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="manifest" href="site.webmanifest">
    <script src="idle-home-redirect.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheets - The Mommy App</title>
    <link rel="stylesheet" href="fonts-local.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="paradigm.css">
    <link rel="stylesheet" href="kid-app-navigation.css">
    <link rel="stylesheet" href="type4-cell-design-common.css">
    <link rel="stylesheet" href="kid-writing-sheet-manage.css">
    <link rel="stylesheet" href="report-hero-preview.css">
</head>
<body class="practice-page manage-page worksheet-manage-page">
    <div class="container">
        <header class="page-header-with-back page-header-with-actions">
            <div class="page-header-row">
                <h1 class="paradigm-kid-page-title">
                    <span class="page-title-icon kid-initial-avatar paradigm-kid-title-avatar paradigm-kid-title-avatar--pending" aria-hidden="true"></span>
                    <span id="pageTitle">Chinese Writing Sheets</span>
                </h1>
                <div class="page-header-actions" data-family-user-switcher></div>
            </div>
        </header>

        <div id="errorMessage" class="error hidden"></div>

        <div class="type2-sheet-layout">
            <section id="sheetHistorySection" class="paradigm-settings-panel">
                <h2 class="paradigm-panel-title">
                    <span class="paradigm-panel-title-icon"><span class="icon" data-icon="history" data-icon-size="18"></span></span>
                    <span id="sheetHistoryTitle" class="paradigm-panel-heading">Sheets</span>
                    <span class="paradigm-row-action-group paradigm-panel-action" aria-label="Build sheets">
                        <button type="button" id="buildChineseSheetBtn" class="paradigm-btn sheet-create-pill" title="Create default" aria-label="Create default" aria-disabled="true">
                            <span class="icon" data-icon="layout-grid" data-icon-size="16"></span>
                            <span>Create default</span>
                        </button>
                        <button type="button" id="buildSheetBtn" class="paradigm-btn sheet-create-pill hidden" title="Create default" aria-label="Create default" disabled>
                            <span class="icon" data-icon="layout-grid" data-icon-size="16"></span>
                            <span>Create default</span>
                        </button>
                        <button type="button" id="buildInlineSheetBtn" class="paradigm-btn sheet-create-pill hidden" title="Create compact" aria-label="Create compact" disabled>
                            <span class="icon" data-icon="rows-3" data-icon-size="16"></span>
                            <span>Create compact</span>
                        </button>
                    </span>
                </h2>
                <div id="sheetBuildHint" class="sheet-build-hint hidden" role="status" aria-live="polite"></div>
                <div id="sheetErrorMessage" class="error hidden"></div>
                <div id="mathSheetErrorMessage" class="error hidden"></div>
                <p id="sheetHistoryNote" class="sheet-subgroup-note hidden"></p>
                <div id="sheetList" class="sheet-list"></div>
            </section>
        </div>
    </div>

    <!-- Shared shell for Chinese, vertical math, and inline math builders. -->
    <template id="sheetBuilderChromeTemplate">
        <div class="paradigm-sheet-header">
            <h2 class="paradigm-sheet-title"></h2>
            <button type="button" class="paradigm-icon-btn paradigm-sheet-close" aria-label="Close" title="Close">×</button>
        </div>
        <div class="sheet-builder-actions">
            <span class="sheet-builder-question-count" role="status" aria-live="polite" aria-atomic="true">0 questions total</span>
            <button type="button" class="paradigm-btn paradigm-submit-confirm paradigm-compact-control" aria-label="Save sheet" title="Save sheet" disabled><span class="icon" data-icon="check" data-icon-size="16" data-icon-stroke="2.4"></span></button>
        </div>
    </template>

    <!-- Chinese Writing Sheet Builder Modal -->
    <div id="chineseSheetBuilderModal" class="modal hidden paradigm-sheet-modal sheet-builder-modal" data-builder-prefix="chineseSheet" data-builder-title="Build Writing Sheet" aria-hidden="true">
        <div class="modal-content paradigm-sheet-dialog">
            <div class="sheet-builder-head">
                <div style="display:inline-flex; align-items:center; gap:0.8rem; flex-wrap:wrap;">
                    <span class="sheet-builder-paper-control queue-stepper">
                        <span>Size</span>
                        <button type="button" id="cwGlobalScaleDown" class="queue-stepper-btn" title="Smaller"><span data-icon="minus"></span></button>
                        <span id="cwGlobalScaleLabel" class="point-log-stepper-input">130%</span>
                        <button type="button" id="cwGlobalScaleUp" class="queue-stepper-btn" title="Larger"><span data-icon="plus"></span></button>
                    </span>
                    <span class="sheet-builder-paper-control queue-stepper">
                        <span>Practice</span>
                        <button type="button" id="cwEmptyCountDown" class="queue-stepper-btn" title="Fewer practice boxes"><span data-icon="minus"></span></button>
                        <span id="cwEmptyCountLabel" class="point-log-stepper-input">1</span>
                        <button type="button" id="cwEmptyCountUp" class="queue-stepper-btn" title="More practice boxes"><span data-icon="plus"></span></button>
                    </span>
                    <label class="sheet-builder-paper-control" for="chineseSheetPaperSize">
                        <span>Paper</span>
                        <span class="tz-dropdown sheet-builder-paper-select">
                            <span class="tz-dropdown-btn-icon" data-icon="printer" data-icon-stroke="2"></span>
                            <select id="chineseSheetPaperSize" class="tz-dropdown-btn">
                                <option value="letter">8.5 x 11 (US Letter)</option>
                                <option value="a4">8.27 x 11.69 (A4)</option>
                            </select>
                            <span class="tz-dropdown-btn-caret" data-icon="chevron-down"></span>
                        </span>
                    </label>
                </div>
            </div>
            <div class="sheet-builder-body">
                <div style="display:flex; justify-content:center; min-width:max-content;">
                    <div id="chineseSheetA4" style="position:relative; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.12);"></div>
                </div>
                <div id="chineseSheetPicker" class="sb-picker-backdrop hidden" aria-hidden="true">
                    <div class="sb-picker-card">
                        <button type="button" id="chineseSheetPickerCancelBtn" class="paradigm-icon-btn paradigm-sheet-close sb-picker-close" aria-label="Close" title="Close">×</button>
                        <div class="sb-picker-header">
                            <h3 class="sb-picker-title" id="chineseSheetPickerTitle">Choose Character</h3>
                            <div id="chineseSheetPickerFilter" class="paradigm-chip-toggle-group paradigm-segmented-toggle" role="group" aria-label="Character filter">
                                <button type="button" class="paradigm-chip-toggle active" data-character-filter="recommended" aria-pressed="true">Recommended</button>
                                <button type="button" class="paradigm-chip-toggle" data-character-filter="all" aria-pressed="false">All</button>
                            </div>
                        </div>
                        <div class="search-bar sb-picker-search">
                            <input id="chineseSheetPickerSearch" type="search" class="paradigm-search-input" placeholder="Search characters or card text…" aria-label="Search characters or card text" autocomplete="off">
                        </div>
                        <div id="chineseSheetPickerLegend" class="sb-picker-legend" aria-label="Character source legend">
                            <span class="sb-picker-legend-item"><span class="sb-picker-legend-dot reason-new" aria-hidden="true"></span>Newly added</span>
                            <span class="sb-picker-legend-item"><span class="sb-picker-legend-dot reason-failed" aria-hidden="true"></span>Last failed</span>
                            <span id="chineseSheetPickerOtherLegend" class="sb-picker-legend-item hidden"><span class="sb-picker-legend-dot reason-default" aria-hidden="true"></span>Not recommended</span>
                        </div>
                        <div id="chineseSheetPickerOptions" class="sb-picker-options sb-picker-options-bubbles"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cell Designer Modal -->
    <div id="cellDesignModal" class="modal hidden" aria-hidden="true">
        <div class="modal-content" style="max-width:720px; padding:1.2rem 1.4rem;">
            <div style="margin-bottom:0.8rem; text-align:center;">
                <span id="cellDesignDimensions" style="font-size:0.95rem; color:#555; font-weight:600;"></span>
            </div>
            <div id="cellDesignCanvas">
                <div id="cellDesignStage">
                    <div class="cell-design-side-controls top">
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="grow-n" aria-label="Grow top edge upward">↑</button>
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="shrink-n" aria-label="Shrink top edge downward">↓</button>
                    </div>
                    <div class="cell-design-side-controls bottom">
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="grow-s" aria-label="Grow bottom edge downward">↓</button>
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="shrink-s" aria-label="Shrink bottom edge upward">↑</button>
                    </div>
                    <div class="cell-design-side-controls left">
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="grow-w" aria-label="Grow left edge outward">←</button>
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="shrink-w" aria-label="Shrink left edge inward">→</button>
                    </div>
                    <div class="cell-design-side-controls right">
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="grow-e" aria-label="Grow right edge outward">→</button>
                        <button type="button" class="cell-design-edge-btn" data-cell-resize="shrink-e" aria-label="Shrink right edge inward">←</button>
                    </div>
                    <div id="cellDesignWorkArea">
                        <div id="cellDesignBox">
                            <div id="cellDesignContent"></div>
                        </div>
                    </div>
                </div>
            </div>
            <p id="cellDesignError" class="sb-cell-design-error" role="alert"></p>
            <div id="cellDesignActions" class="cell-design-actions">
                <button type="button" id="cellDesignCancelBtn" class="paradigm-chip-toggle cell-design-cancel" aria-label="Cancel" title="Cancel">Cancel</button>
                <button type="button" id="cellDesignSaveBtn" class="paradigm-chip-toggle cell-design-confirm" aria-label="Save cell design" title="Save cell design" disabled>Confirm</button>
            </div>
        </div>
    </div>

    <!-- Sheet Builder Modal -->
    <div id="sheetBuilderModal" class="modal hidden paradigm-sheet-modal sheet-builder-modal" data-builder-prefix="sheetBuilder" data-builder-title="Build Vertical Sheet" aria-hidden="true">
        <div class="modal-content paradigm-sheet-dialog">
            <div class="sheet-builder-head">
                <label class="sheet-builder-paper-control" for="sheetBuilderPaperSize">
                    <span>Paper</span>
                    <span class="tz-dropdown sheet-builder-paper-select">
                        <span class="tz-dropdown-btn-icon" data-icon="printer" data-icon-stroke="2"></span>
                        <select id="sheetBuilderPaperSize" class="tz-dropdown-btn">
                            <option value="letter">8.5 x 11 (US Letter)</option>
                            <option value="a4">8.27 x 11.69 (A4)</option>
                        </select>
                        <span class="tz-dropdown-btn-caret" data-icon="chevron-down"></span>
                    </span>
                </label>
            </div>
            <div class="sheet-builder-body">
                <div style="display:flex; justify-content:center; min-width:max-content;">
                    <div id="sheetBuilderA4" style="position:relative; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.12);"></div>
                </div>
                <div id="sheetBuilderPicker" class="sb-picker-backdrop hidden" aria-hidden="true">
                    <div class="sb-picker-card">
                        <button type="button" id="sheetBuilderPickerCancelBtn" class="paradigm-icon-btn paradigm-sheet-close sb-picker-close" aria-label="Close" title="Close">×</button>
                        <h3 class="sb-picker-title" id="sheetBuilderPickerTitle">Choose Card</h3>
                        <p class="sb-picker-note">Pick one of the card designs you already prepared.</p>
                        <div id="sheetBuilderPickerOptions" class="sb-picker-options"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline Sheet Builder Modal -->
    <div id="inlineSheetBuilderModal" class="modal hidden paradigm-sheet-modal sheet-builder-modal" data-builder-prefix="inlineSheet" data-builder-title="Build Inline Sheet" aria-hidden="true">
        <div class="modal-content paradigm-sheet-dialog">
            <div class="sheet-builder-head">
                <label class="sheet-builder-paper-control" for="inlineSheetPaperSize">
                    <span>Paper</span>
                    <span class="tz-dropdown sheet-builder-paper-select">
                        <span class="tz-dropdown-btn-icon" data-icon="printer" data-icon-stroke="2"></span>
                        <select id="inlineSheetPaperSize" class="tz-dropdown-btn">
                            <option value="letter">8.5 x 11 (US Letter)</option>
                            <option value="a4">8.27 x 11.69 (A4)</option>
                        </select>
                        <span class="tz-dropdown-btn-caret" data-icon="chevron-down"></span>
                    </span>
                </label>
            </div>
            <div class="sheet-builder-body">
                <div style="display:flex; justify-content:center; min-width:max-content;">
                    <div id="inlineSheetA4" style="position:relative; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.12);"></div>
                </div>
                <div id="inlineSheetPicker" class="sb-picker-backdrop hidden" aria-hidden="true">
                    <div class="sb-picker-card">
                        <button type="button" id="inlineSheetPickerCancelBtn" class="paradigm-icon-btn paradigm-sheet-close sb-picker-close" aria-label="Close" title="Close">×</button>
                        <h3 class="sb-picker-title">Choose Deck</h3>
                        <div id="inlineSheetPickerOptions" class="sb-picker-options"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="icons.js"></script>
    <script src="search-bar.js"></script>
    <script src="family-user-switcher.js"></script>
    <script src="kid-app-navigation.js"></script>
    <script src="deck-category-common.js"></script>
    <script src="practice-manage-common.js"></script>
    <script src="practice-ui-common.js"></script>
    <script src="math-rendering-common.js"></script>
    <script src="sheet-builder-dialog.js"></script>
    <script src="kid-writing-sheet-manage-core.js"></script>
    <script src="kid-writing-sheet-manage-lists.js"></script>
    <script src="kid-writing-sheet-manage-builder.js"></script>
</body>
</html>
