<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=mommy-icon2-20260607">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=mommy-icon2-20260607">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=mommy-icon2-20260607">
    <link rel="shortcut icon" href="favicon.ico?v=mommy-icon2-20260607">
    <link rel="manifest" href="site.webmanifest?v=mommy-icon2-20260607">
    <script src="idle-home-redirect.js"></script>
    <script src="offline-redirect-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Points - The Mommy App</title>
    <link rel="stylesheet" href="fonts-local.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="paradigm.css?v=shared-timeline-no-axis-20261008">
    <link rel="stylesheet" href="home-redesign-v4.css">
    <link rel="stylesheet" href="subject-icons.css">
    <link rel="stylesheet" href="kid-app-navigation.css">
    <link rel="stylesheet" href="point-log.css?v=wide-short-today-pill-20261008">
    <link rel="stylesheet" href="kid-rewards.css?v=sync-probe-20261008">
</head>
<body class="manage-page kid-rewards-page">
    <div class="container">
        <header class="page-header-with-back page-header-with-actions kid-rewards-header">
            <div class="page-header-row">
                <h1>
                    <span class="page-title-icon" aria-hidden="true">⭐</span>
                    Points
                </h1>
                <div class="page-header-end">
                    <div id="kidRewardAvatarSwitcher" class="kid-avatar-switcher hidden" role="tablist" aria-label="Kids"></div>
                    <div class="page-header-actions" data-family-user-switcher></div>
                </div>
            </div>
        </header>

        <main class="point-log-layout">
            <div id="kidRewardsError" class="error hidden"></div>

            <section class="settings-card settings-section paradigm-settings-panel paradigm-settings-panel--content-first kid-rewards-race-section">
                <div class="settings-card-body kid-rewards-race-workbench">
                    <div class="kid-rewards-race-heading">
                        <div class="kid-rewards-race-title"><span aria-hidden="true">🏆</span><div><h2 id="kidRewardsRaceTitle" class="paradigm-panel-heading">This Week's Race</h2><p id="kidRewardsWeekMeta"></p></div></div>
                        <div class="kid-rewards-week-controls"><span id="kidRewardsDaysLeft"></span></div>
                    </div>
                    <div id="kidRewardsBalanceRace" class="kid-rewards-balance-race"></div>
                    <div class="kid-rewards-board-heading"><span aria-hidden="true">🎯</span><h2 class="paradigm-panel-heading">Race Board</h2></div>
                    <div id="kidRewardsRaceCards" class="kid-rewards-race-cards"></div>
                </div>
            </section>

            <section class="settings-card settings-section point-history-section">
                <div class="settings-card-body">
                    <div id="kidPointHistory" class="point-history"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="icons.js"></script>
    <script src="family-user-switcher.js"></script>
    <script src="kid-app-navigation.js"></script>
    <script src="subject-icons.js"></script>
    <script src="deck-category-common.js"></script>
    <script src="point-history-common.js?v=week-today-circle-20261008"></script>
    <script src="kid-rewards.js?v=selected-day-week-anchor-20261008"></script>
</body>
</html>
